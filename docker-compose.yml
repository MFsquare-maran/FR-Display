services:
  fr-display:
    build: .
    pull_policy: build        # bei jedem Deploy (auch Pull and redeploy in Portainer) das Image neu bauen
    container_name: fr-display
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:${PORT:-8765}"
    environment:
      PORT: "${PORT:-8765}"
      START_ICAO: "${START_ICAO:-LSZH}"
      TZ: "${TZ:-Europe/Zurich}"
    # Container läuft standardmäßig als root, damit der gemountete Cache-Ordner sicher beschreibbar ist
    # (anderer Benutzer: PUID/PGID setzen und den Ordner mit chown passend vergeben)
    user: "${PUID:-0}:${PGID:-0}"
    volumes:
      # Flughafen-Cache liegt auf dem Host und überlebt Updates, Neuerstellen und Löschen des Stacks
      - "${CACHE_PATH:-/home/maran/serverdata/server/fr-display/cache}:/app/cache"
